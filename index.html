---
layout: default
title: Choose language
---
{% comment %}
  First visit: choose a language. The choice is remembered in the browser
  (every page of a language saves it), so next time "/" opens it at once.
{% endcomment %}
<script>
  try {
    var saved = localStorage.getItem('lang');
    if ({{ site.languages | jsonify }}.indexOf(saved) > -1) location.replace('/' + saved + '/');
  } catch (e) {}
</script>
<section class="choose">
  <nav class="choose-langs" aria-label="Language">
    {% for l in site.languages %}
    <a class="big-title" href="{{ '/' | append: l | append: '/' | relative_url }}" hreflang="{{ l }}" lang="{{ l }}" data-lang="{{ l }}">{{ site.data.i18n[l].name }}</a>
    {% endfor %}
  </nav>
</section>
<script>
  // Put the browser's language first.
  (function () {
    var nav = document.querySelector('.choose-langs');
    var wanted = (navigator.languages || [navigator.language || '']);
    for (var i = 0; i < wanted.length; i++) {
      var a = nav.querySelector('[data-lang="' + String(wanted[i]).slice(0, 2).toLowerCase() + '"]');
      if (a) { nav.insertBefore(a, nav.firstChild); return; }
    }
  })();
</script>
