---
layout: default
---
<article class="article">
  <h1>{{ page.title }}</h1>
  <p class="meta">[ {{ page.author | default: site.author }} ] <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y-%m-%d" }}</time></p>
  {{ content }}
</article>
<p class="more article-more"><a href="{{ '/texts/' | relative_url }}">[ all texts → ]</a></p>
