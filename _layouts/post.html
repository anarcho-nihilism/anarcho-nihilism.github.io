---
layout: default
---
<article class="article">
  <h1>{{ page.title }}</h1>
  <p class="meta">[ {{ page.author | default: site.author }} ] <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y-%m-%d" }}</time></p>
  {{ content }}
</article>
{% assign t = site.data.i18n[page.lang] %}
<p class="more article-more"><a href="{{ '/' | append: page.lang | append: '/texts/' | relative_url }}">[ {{ t.all_texts }} → ]</a></p>
