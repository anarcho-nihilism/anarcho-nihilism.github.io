<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  {% feed_meta %}
  <link rel="preload" href="{{ '/assets/fonts/FliegeMono-Medium.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cousine&family=Sofia+Sans+Extra+Condensed:wght@900&display=swap">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body{% if page.url == '/' %} class="home"{% endif %}>
  <header class="site-header">
    <a class="brand" href="{{ '/' | relative_url }}">[ {{ site.title }} ]</a>
    <nav class="menu" aria-label="Main">
      <a href="{{ '/texts/' | relative_url }}">[ texts ]</a>
      <a href="{{ '/manifest/' | relative_url }}">[ manifesto ]</a>
      <a href="{{ '/about/' | relative_url }}">[ about ]</a>
    </nav>
  </header>
  <main>
    {{ content }}
  </main>
  <footer class="site-footer">
    <ul class="social">
      {% for link in site.social %}
      <li><a href="{{ link.url }}">[ {{ link.name }} ]</a></li>
      {% endfor %}
    </ul>
    <a class="footer-logo" href="{{ '/' | relative_url }}"><img src="{{ '/assets/design/logo.svg' | relative_url }}" alt="{{ site.title }}" width="422" height="169"></a>
    <p class="copy">{{ site.title }}, {{ site.time | date: '%Y' }}</p>
  </footer>
</body>
</html>
