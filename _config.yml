title: Chaos League
# Short text for search results and link previews of the home page.
description: The anarchist idea is irrelevant today without the nihilism it needs. The madness of modernity demands an uncompromising vivisection by post-left thought, which you will find here.
# Default author shown on text cards and articles.
# One article can override it with "author: Name" in front matter.
author: None
# Social links in the footer. Example:
#   - name: Telegram
#     url: https://t.me/example
social: []
url: https://anarcho-nihilism.github.io
lang: en
# Site languages. Each has a folder (en/, pl/, ru/) and words in _data/i18n.yml.
languages: [en, pl, ru]

plugins:
  - jekyll-titles-from-headings
  # SEO: meta tags, sitemap.xml + robots.txt, RSS feeds
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

# Take the title from the first "# heading" of a file, also for articles.
# The heading is removed from the body, so it is not shown twice.
titles_from_headings:
  enabled: true
  strip_title: true
  collections: true

# Markdown files without front matter become pages (GitHub default).
# Do not also publish the raw .md file next to the page.
optional_front_matter:
  remove_originals: true

# Article URLs: /pl/texts/2026/11/my-title/
# The language comes from the folder: pl/_posts/ gives category "pl".
permalink: /:categories/texts/:year/:month/:title/

# One RSS feed per language: /feed/en.xml, /feed/pl.xml, /feed/ru.xml
feed:
  categories: [en, pl, ru]

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  # Everything in a language folder gets that language.
  - scope:
      path: "en"
    values:
      lang: en
  # Search/preview text for pages (home, texts, manifest...).
  # Articles use their first paragraph instead.
  - scope:
      path: "en"
      type: pages
    values:
      description: "The anarchist idea is irrelevant today without the nihilism it needs. The madness of modernity demands an uncompromising vivisection by post-left thought, which you will find here."
  - scope:
      path: "pl"
    values:
      lang: pl
  # Search/preview text for pages (home, texts, manifest...).
  # Articles use their first paragraph instead.
  - scope:
      path: "pl"
      type: pages
    values:
      description: "Idea anarchistyczna jest dziś nieaktualna bez niezbędnego nihilizmu. Szaleństwo współczesności wymaga bezkompromisowej wiwisekcji ze strony myśli postlewicowej, którą znajdziesz tutaj."
  - scope:
      path: "ru"
    values:
      lang: ru
  # Search/preview text for pages (home, texts, manifest...).
  # Articles use their first paragraph instead.
  - scope:
      path: "ru"
      type: pages
    values:
      description: "Анархическая идея сегодня неактуальна без необходимого нигилизма. Безумие современности требует бескомпромиссной вивисекции со стороны постлевой мысли, которую ты найдёшь тут."
  # Static pages: pl/pages/manifest.md -> /pl/manifest/
  - scope:
      path: "en/pages"
    values:
      layout: page
      permalink: /en/:basename/
  - scope:
      path: "pl/pages"
    values:
      layout: page
      permalink: /pl/:basename/
  - scope:
      path: "ru/pages"
    values:
      layout: page
      permalink: /ru/:basename/

# Repo files like README.md are not pages. Matches root files starting
# with a capital letter. Lowercase names (articles, pages) are kept.
exclude:
  - "[A-Z]*.md"
  - Gemfile
  - Gemfile.lock
  - vendor
  - Fliege-mono.zip
