title: Chaos League
# Short text for search results and link previews of the home page.
description: A collection of independent essays on post-left nihilism and anarchism.
# Default author shown on text cards and articles.
# One article can override it with "author: Name" in front matter.
author: None
# Social links in the footer. Example:
#   - name: Telegram
#     url: https://t.me/example
social: []
url: https://anarcho-nihilism.github.io
lang: en

plugins:
  - jekyll-paginate
  - jekyll-titles-from-headings
  # SEO: meta tags, sitemap.xml + robots.txt, RSS feed at /feed.xml
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

# Take the title from the first "# heading" of a file, also for articles.
# The heading is removed from the body, so it is not shown twice.
titles_from_headings:
  enabled: true
  strip_title: true
  collections: true

# Markdown files without front matter become pages (GitHub default).
# Do not also publish the raw .md file next to the page.
optional_front_matter:
  remove_originals: true

# Pagination of the texts list: /texts/, /texts/page2/, ...
paginate: 10
paginate_path: "/texts/page:num/"

# Article URLs: /texts/2026/11/my-title/
permalink: /texts/:year/:month/:title/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  # Static pages live in pages/: pages/manifest.md -> /manifest/
  - scope:
      path: "pages"
    values:
      layout: page
      permalink: /:basename/

# Repo files like README.md are not pages. Matches root files starting
# with a capital letter. Lowercase names (articles, pages) are kept.
exclude:
  - "[A-Z]*.md"
  - Gemfile
  - Gemfile.lock
  - vendor
  - Fliege-mono.zip
